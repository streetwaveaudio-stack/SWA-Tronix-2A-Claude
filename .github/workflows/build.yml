name: Build SWA Tronix 2A (VST3)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
            cmake_extra_args: ""
          - os: ubuntu-22.04
            name: Linux
            cmake_extra_args: ""
          - os: windows-2022
            name: Windows
            cmake_extra_args: "-A x64"

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev ladspa-sdk

      - name: Configurar CMake
        run: cmake -B build ${{ matrix.cmake_extra_args }} -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Localizar binario VST3
        shell: bash
        run: find build -iname "*.vst3" -print

      - name: Subir artefacto VST3
        uses: actions/upload-artifact@v4
        with:
          name: SWA-Tronix-2A-VST3-${{ matrix.name }}
          path: |
            build/**/*.vst3
